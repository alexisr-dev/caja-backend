        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - turnos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTurnoList'
          description: ''
  /api/turnos/{id}/:
    get:
      operationId: turnos_retrieve
      description: Detalle de un turno. Vendedor solo accede al suyo.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - turnos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turno'
          description: ''
  /api/turnos/abrir/:
    post:
      operationId: turnos_abrir_create
      description: Abre un turno nuevo. El vendedor solo puede tener 1 ABIERTO (DB
        lo garantiza).
      tags:
      - turnos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/turnos/activo/:
    get:
      operationId: turnos_activo_retrieve
      description: Devuelve el turno abierto del vendedor actual, o 404.
      tags:
      - turnos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/turnos/cerrar/:
    post:
      operationId: turnos_cerrar_create
      description: Cierra el turno activo del vendedor autenticado.
      tags:
      - turnos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Alerta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/AlertaTipoEnum'
          readOnly: true
        tipo_display:
          type: string
          readOnly: true
        nivel:
          allOf:
          - $ref: '#/components/schemas/NivelEnum'
          readOnly: true
        nivel_display:
          type: string
          readOnly: true
        mensaje:
          type: string
          readOnly: true
        producto_sku:
          type: string
          readOnly: true
        producto_nombre:
          type: string
          readOnly: true
        leida:
          type: boolean
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
      required:
      - fecha
      - id
      - leida
      - mensaje
      - nivel
      - nivel_display
      - producto_nombre
      - producto_sku
      - tipo
      - tipo_display
    AlertaTipoEnum:
      enum:
      - STOCK_BAJO
      - STOCK_AGOTADO
      - VENCIMIENTO_CERCANO
      - SISTEMA
      - PAGO_FALLIDO
      type: string
      description: |-
        * `STOCK_BAJO` - Stock bajo
        * `STOCK_AGOTADO` - Stock agotado
        * `VENCIMIENTO_CERCANO` - Proximo a vencer
        * `SISTEMA` - Sistema
        * `PAGO_FALLIDO` - Pago fallido
    BoletaList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: string
          readOnly: true
        tipo:
          $ref: '#/components/schemas/BoletaListTipoEnum'
        estado:
          $ref: '#/components/schemas/BoletaListEstadoEnum'
        fecha:
          type: string
          format: date-time
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        cliente_email:
          type: string
          format: email
          readOnly: true
        vendedor_email:
          type: string
          format: email
          readOnly: true
      required:
      - cliente_email
      - fecha
      - id
      - numero
      - total
      - vendedor_email
    BoletaListEstadoEnum:
      enum:
      - PENDIENTE
      - PAGADA
      - ANULADA
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `PAGADA` - Pagada
        * `ANULADA` - Anulada
    BoletaListTipoEnum:
      enum:
      - BOLETA
      - TICKET
      type: string
      description: |-
        * `BOLETA` - Boleta
        * `TICKET` - Ticket
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
        imagen_icono:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - nombre
    Descuento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        producto:
          type: string
          description: 'Convencion: <CATEGORIA>-<correlativo> (ej: BEB-001, CON-001).
            Debe coincidir EXACTAMENTE con el prefijo del id_chroma en ChromaDB (el
            ia-service hace split("_")[0] para extraerlo).'
        tipo:
          $ref: '#/components/schemas/DescuentoTipoEnum'
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
          description: Para PORCENTAJE (0-100) o MONTO_FIJO (>0). Vacio si tipo=NXM.
        lleva_n:
          type: integer
          maximum: 2147483647
          minimum: 2
          nullable: true
          description: 'Solo NXM: cantidad que lleva el cliente'
        paga_m:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: 'Solo NXM: cantidad que paga (debe ser < lleva_n)'
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        activo:
          type: boolean
      required:
      - fecha_fin
      - fecha_inicio
      - id
      - producto
      - tipo
    DescuentoTipoEnum:
      enum:
      - PORCENTAJE
      - MONTO_FIJO
      - NXM
      type: string
      description: |-
        * `PORCENTAJE` - % descuento
        * `MONTO_FIJO` - Monto fijo S/
        * `NXM` - N por M (2x1, 3x2)
    DispositivoFCM:
      type: object
      description: POST /api/dispositivos-fcm/ — registrar o actualizar token.
      properties:
        id:
          type: integer
          readOnly: true
        token_fcm:
          type: string
          maxLength: 500
        plataforma:
          $ref: '#/components/schemas/PlataformaEnum'
        activo:
          type: boolean
          readOnly: true
        registrado:
          type: string
          format: date-time
          readOnly: true
      required:
      - activo
      - id
      - plataforma
      - registrado
      - token_fcm
    Favorito:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        producto:
          type: string
          description: 'Convencion: <CATEGORIA>-<correlativo> (ej: BEB-001, CON-001).
            Debe coincidir EXACTAMENTE con el prefijo del id_chroma en ChromaDB (el
            ia-service hace split("_")[0] para extraerlo).'
        producto_detalle:
          allOf:
          - $ref: '#/components/schemas/ProductoList'
          readOnly: true
        creado:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado
      - id
      - producto
      - producto_detalle
    FotoProducto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        imagen:
          type: string
          format: uri
        orden:
          type: integer
          maximum: 2147483647
          minimum: 0
        creado:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado
      - id
      - imagen
    HistorialPrecio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        precio_anterior:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        precio_nuevo:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        usuario_email:
          type: string
          format: email
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
        motivo:
          type: string
          maxLength: 255
      required:
      - fecha
      - id
      - precio_anterior
      - precio_nuevo
      - usuario_email
    LogEscaneo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        modo:
          $ref: '#/components/schemas/ModoEnum'
        resultado:
          $ref: '#/components/schemas/ResultadoEnum'
        confianza:
          type: number
          format: double
          nullable: true
        latencia_ms:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        usuario_email:
          type: string
          format: email
          readOnly: true
        producto_sku:
          type: string
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
      required:
      - fecha
      - id
      - modo
      - producto_sku
      - resultado
      - usuario_email
    Login:
      type: object
      description: Solo valida shape. Authenticate() corre en la view.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Login2FA:
      type: object
      description: |-
        Verifica el codigo 2FA. La view busca el CodigoVerificacion2FA por
        (usuario, codigo) y revisa expiracion.
      properties:
        usuario_temp_id:
          type: integer
        codigo:
          type: string
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - codigo
      - usuario_temp_id
    ModoEnum:
      enum:
      - MOVIL
      - CAJA
      type: string
      description: |-
        * `MOVIL` - Movil (cliente)
        * `CAJA` - Caja (vendedor)
    NivelEnum:
      enum:
      - INFO
      - ADVERTENCIA
      - CRITICO
