        proveedor:
          allOf:
          - $ref: '#/components/schemas/Proveedor'
          readOnly: true
        padre:
          type: string
          description: Si es variante, apunta al producto padre
          nullable: true
        es_padre:
          type: boolean
          readOnly: true
        es_variante:
          type: boolean
          readOnly: true
        variantes:
          type: array
          items:
            $ref: '#/components/schemas/ProductoList'
          readOnly: true
        fotos:
          type: array
          items:
            $ref: '#/components/schemas/FotoProducto'
          readOnly: true
        descuentos_activos:
          type: string
          readOnly: true
        contador_ventas:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total unidades vendidas. Se actualiza por signal al pagar boleta.
        activo:
          type: boolean
        creado:
          type: string
          format: date-time
          readOnly: true
        actualizado:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado
      - categoria
      - creado
      - descuentos_activos
      - es_padre
      - es_variante
      - fotos
      - nombre
      - precio
      - proveedor
      - sku
      - stock_bajo
      - variantes
    ProductoList:
      type: object
      description: 'Ligero: para listas y tarjetas del frontend.'
      properties:
        sku:
          type: string
          description: 'Convencion: <CATEGORIA>-<correlativo> (ej: BEB-001, CON-001).
            Debe coincidir EXACTAMENTE con el prefijo del id_chroma en ChromaDB (el
            ia-service hace split("_")[0] para extraerlo).'
          pattern: ^[A-Za-z0-9_\-]+$
          maxLength: 50
        nombre:
          type: string
          maxLength: 200
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Precio INCLUYE IGV 18%
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        stock_bajo:
          type: boolean
          readOnly: true
        imagen_principal:
          type: string
          format: uri
          nullable: true
        categoria_nombre:
          type: string
          readOnly: true
        activo:
          type: boolean
        contador_ventas:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total unidades vendidas. Se actualiza por signal al pagar boleta.
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
      required:
      - categoria_nombre
      - nombre
      - precio
      - sku
      - stock_bajo
    ProductoWrite:
      type: object
      description: Para crear y actualizar productos (plano, sin nested writes).
      properties:
        sku:
          type: string
          description: 'Convencion: <CATEGORIA>-<correlativo> (ej: BEB-001, CON-001).
            Debe coincidir EXACTAMENTE con el prefijo del id_chroma en ChromaDB (el
            ia-service hace split("_")[0] para extraerlo).'
          pattern: ^[A-Za-z0-9_\-]+$
          maxLength: 50
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Precio INCLUYE IGV 18%
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        stock_minimo:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Cuando stock <= stock_minimo se genera alerta
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
        imagen_principal:
          type: string
          format: uri
          nullable: true
        categoria:
          type: integer
        proveedor:
          type: integer
          nullable: true
        padre:
          type: string
          description: Si es variante, apunta al producto padre
          nullable: true
        activo:
          type: boolean
      required:
      - categoria
      - nombre
      - precio
      - sku
    Proveedor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ruc:
          type: string
          pattern: ^(10|15|17|20)\d{9}$
          maxLength: 11
        razon_social:
          type: string
          maxLength: 200
        telefono:
          type: string
          description: Puede ser fijo, celular o internacional
          pattern: ^\+?\d{6,15}$
          maxLength: 15
        email:
          type: string
          format: email
          maxLength: 254
        direccion:
          type: string
          maxLength: 255
        persona_contacto:
          type: string
          maxLength: 200
        activo:
          type: boolean
      required:
      - id
      - razon_social
      - ruc
    Registro:
      type: object
      description: Registro de cliente. Siempre crea con rol=CLIENTE (no se acepta
        `rol` del input).
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 9
        dni:
          type: string
          maxLength: 15
      required:
      - email
      - first_name
      - password
    Resena:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        producto:
          type: string
          description: 'Convencion: <CATEGORIA>-<correlativo> (ej: BEB-001, CON-001).
            Debe coincidir EXACTAMENTE con el prefijo del id_chroma en ChromaDB (el
            ia-service hace split("_")[0] para extraerlo).'
        cliente_email:
          type: string
          format: email
          readOnly: true
        estrellas:
          type: integer
          maximum: 5
          minimum: 1
        texto:
          type: string
        fecha:
          type: string
          format: date-time
          readOnly: true
      required:
      - cliente_email
      - estrellas
      - fecha
      - id
      - producto
    ResultadoEnum:
      enum:
      - OK
      - NO_DETECTADO
      - DESCONOCIDO
      - SKU_NO_EXISTE
      - ERROR
      type: string
      description: |-
        * `OK` - Reconocido
        * `NO_DETECTADO` - No detecto
        * `DESCONOCIDO` - Producto desconocido
        * `SKU_NO_EXISTE` - SKU devuelto no existe en BD
        * `ERROR` - Error de servicio
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Turno:
      type: object
      description: Lectura completa con propiedades calculadas.
      properties:
        id:
          type: integer
          readOnly: true
        vendedor:
          type: integer
          readOnly: true
        vendedor_email:
          type: string
          format: email
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/TurnoEstadoEnum'
          readOnly: true
        apertura_fecha:
          type: string
          format: date-time
          readOnly: true
        monto_inicial:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Efectivo con el que abre la caja (cambio inicial).
        cierre_fecha:
          type: string
          format: date-time
          nullable: true
        monto_contado_cierre:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Efectivo contado fisicamente al cerrar.
        total_ventas_efectivo:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        esperado_en_caja:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        diferencia:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        diagnostico:
          type: string
          readOnly: true
        observaciones:
          type: string
      required:
      - apertura_fecha
      - diagnostico
      - diferencia
      - esperado_en_caja
      - estado
      - id
      - monto_inicial
      - total_ventas_efectivo
      - vendedor
      - vendedor_email
    TurnoEstadoEnum:
      enum:
      - ABIERTO
      - CERRADO
      type: string
      description: |-
        * `ABIERTO` - Abierto
        * `CERRADO` - Cerrado
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Autenticacion, registro, 2FA, perfil
- name: productos
  description: Catalogo, stock, historial de precios
- name: descuentos
  description: Descuentos por producto
- name: favoritos
  description: Favoritos del cliente
- name: resenas
  description: Reseñas de productos
- name: turnos
  description: Turnos de caja (apertura/cierre)
- name: boletas
  description: Boletas de venta
- name: carrito
  description: Carrito persistente del cliente
- name: pagos
  description: Efectivo, Mercado Pago, webhook
- name: alertas
  description: Alertas de stock y sistema
- name: notificaciones
  description: Push notifications y dispositivos FCM
- name: ia
  description: Reconocimiento de productos por imagen
- name: reportes
  description: Dashboard y reportes de negocio
