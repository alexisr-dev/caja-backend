openapi: 3.0.3
info:
  title: Caja Backend API
  version: 1.0.0
  description: |
    API REST del sistema de caja inteligente.

    **Autenticacion:** Bearer JWT (access token).
    Obtener tokens en `POST /api/auth/login/`.

    **Roles:**
    - `ADMIN` — acceso total
    - `VENDEDOR` — caja, turnos, boletas, productos (lectura)
    - `CLIENTE` — carrito, mis-boletas, favoritos, reseñas
paths:
  /api/alertas/:
    get:
      operationId: alertas_list
      description: Lista con filtros. Por defecto muestra solo las no leídas.
      parameters:
      - in: query
        name: leida
        schema:
          type: boolean
      - in: query
        name: nivel
        schema:
          type: string
          enum:
          - ADVERTENCIA
          - CRITICO
          - INFO
        description: |-
          * `INFO` - Info
          * `ADVERTENCIA` - Advertencia
          * `CRITICO` - Critico
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - PAGO_FALLIDO
          - SISTEMA
          - STOCK_AGOTADO
          - STOCK_BAJO
          - VENCIMIENTO_CERCANO
        description: |-
          * `STOCK_BAJO` - Stock bajo
          * `STOCK_AGOTADO` - Stock agotado
          * `VENCIMIENTO_CERCANO` - Proximo a vencer
          * `SISTEMA` - Sistema
          * `PAGO_FALLIDO` - Pago fallido
      tags:
      - alertas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertaList'
          description: ''
  /api/alertas/{id}/marcar-leida/:
    post:
      operationId: alertas_marcar_leida_create
      description: POST /api/alertas/{id}/marcar-leida/ — marca una alerta como leída.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alertas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/alertas/marcar-todas/:
    post:
      operationId: alertas_marcar_todas_create
      description: POST /api/alertas/marcar-todas/ — bulk update de no leídas a leídas.
      tags:
      - alertas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        Login/registro con Google. Solo CLIENTE (movil).
        - email nuevo -> crea CustomUser CLIENTE con dni=''
        - email existente CLIENTE -> vincula google_id si no lo tenia
        - email existente ADMIN/VENDEDOR -> 403 (no permitido por seguridad)
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        CLIENTE -> tokens directo
        ADMIN / VENDEDOR -> envia codigo 2FA por email, responde {requiere_2fa: true, usuario_temp_id}
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: 'Tokens JWT (cliente) o {requiere_2fa: true} (admin/vendedor)'
        '401':
          description: Credenciales inválidas
        '403':
          description: Cuenta desactivada
  /api/auth/login-2fa/:
    post:
      operationId: auth_login_2fa_create
      description: Verifica el codigo 2FA y emite tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login2FA'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login2FA'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login2FA'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Blacklist del refresh token. Idempotente: token ya invalidado
        -> 205 igual.'
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/password-reset-confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password-reset-request/:
    post:
      operationId: auth_password_reset_request_create
      description: |-
        Senior fix: SIEMPRE responde 200 (no revelar si el email existe).
        Si el email existe, genera token y manda email; si no, no hace nada.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/perfil/:
    get:
      operationId: auth_perfil_retrieve
      description: Lectura y edicion del perfil propio. Bloquea cambios a email/rol/password.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_perfil_partial_update
      description: Lectura y edicion del perfil propio. Bloquea cambios a email/rol/password.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/registro/:
    post:
      operationId: auth_registro_create
      description: Crea un cliente nuevo y devuelve tokens (auto-login).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registro'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registro'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
          description: ''
  /api/boletas/:
    get:
      operationId: boletas_retrieve
      description: |-
        GET:  Admin/Vendedor ven todas las boletas con filtros.
        POST: Cualquier autenticado puede crear una boleta (genera en estado PENDIENTE).
      tags:
      - boletas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: boletas_create
      description: |-
        GET:  Admin/Vendedor ven todas las boletas con filtros.
        POST: Cualquier autenticado puede crear una boleta (genera en estado PENDIENTE).
      tags:
      - boletas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/boletas/{id}/:
    get:
      operationId: boletas_retrieve_2
      description: 'GET: Admin/Vendedor o el cliente dueño de la boleta.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - boletas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/boletas/{id}/anular/:
    post:
      operationId: boletas_anular_create
      description: POST /api/boletas/{id}/anular/ — solo boletas PAGADAS (Admin/Vendedor).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - boletas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/carrito/:
    get:
      operationId: carrito_retrieve
      description: 'GET: devuelve el carrito (crea si no existe). DELETE: vacia todos
        los items.'
      tags:
      - carrito
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: carrito_destroy
      description: 'GET: devuelve el carrito (crea si no existe). DELETE: vacia todos
        los items.'
      tags:
      - carrito
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/carrito/items/:
    post:
      operationId: carrito_items_create
      description: POST /api/carrito/items/ — agrega o actualiza cantidad si el item
        ya existe.
      tags:
      - carrito
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/carrito/items/{id}/:
    patch:
      operationId: carrito_items_partial_update
      description: PATCH /api/carrito/items/{id}/ — cambia cantidad.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - carrito
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/carrito/items/{id}/delete/:
    delete:
      operationId: carrito_items_delete_destroy
      description: DELETE /api/carrito/items/{id}/ — elimina un item del carrito.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - carrito
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/dispositivos-fcm/:
    post:
      operationId: dispositivos_fcm_create
      description: POST /api/dispositivos-fcm/ — upsert del token FCM del dispositivo
        actual.
      tags:
      - notificaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositivoFCM'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DispositivoFCM'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DispositivoFCM'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivoFCM'
          description: ''
  /api/dispositivos-fcm/{id}/:
    delete:
      operationId: dispositivos_fcm_destroy
      description: DELETE /api/dispositivos-fcm/{id}/ — desactiva un token FCM propio.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notificaciones
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/escanear/:
    post:
      operationId: escanear_create
      description: |-
        Recibe una imagen, la envia al ia-service, registra el log y devuelve
        el producto detectado (o motivo de fallo).

        Modo se infiere del rol:
        - CLIENTE -> MOVIL
        - ADMIN/VENDEDOR -> CAJA
      tags:
      - ia
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/ia/catalogo/stats/:
    get:
      operationId: ia_catalogo_stats_retrieve
      description: Stats del catalogo ChromaDB (cuantos vectores, etc). Solo Admin.
      tags:
      - ia
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/ia/health/:
    get:
      operationId: ia_health_retrieve
      description: Verifica si el ia-service esta vivo. Solo Admin.
      tags:
      - ia
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/logs-escaneos/:
    get:
      operationId: logs_escaneos_list
      description: Lista de logs con filtros por resultado, modo y rango de fechas.
      parameters:
      - in: query
        name: modo
        schema:
          type: string
          enum:
          - CAJA
          - MOVIL
        description: |-
          * `MOVIL` - Movil (cliente)
          * `CAJA` - Caja (vendedor)
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: resultado
        schema:
          type: string
          enum:
          - DESCONOCIDO
          - ERROR
          - NO_DETECTADO
          - OK
          - SKU_NO_EXISTE
        description: |-
          * `OK` - Reconocido
          * `NO_DETECTADO` - No detecto
          * `DESCONOCIDO` - Producto desconocido
          * `SKU_NO_EXISTE` - SKU devuelto no existe en BD
          * `ERROR` - Error de servicio
      tags:
      - ia
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogEscaneoList'
          description: ''
  /api/mis-boletas/:
    get:
      operationId: mis_boletas_list
      description: GET /api/mis-boletas/ — historial del cliente autenticado.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - boletas
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoletaListList'
          description: ''
  /api/notificaciones/:
    get:
      operationId: notificaciones_list
      description: Historial de notificaciones del usuario actual. Por defecto solo
        no leídas.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - notificaciones
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificacionList'
          description: ''
  /api/notificaciones/{id}/marcar-leida/:
    post:
      operationId: notificaciones_marcar_leida_create
      description: POST /api/notificaciones/{id}/marcar-leida/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notificaciones
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/notificaciones/marcar-todas/:
    post:
      operationId: notificaciones_marcar_todas_create
      description: POST /api/notificaciones/marcar-todas/ — marca todas las del usuario
        como leídas.
      tags:
      - notificaciones
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/pagos/{boleta_id}/:
    get:
      operationId: pagos_retrieve
      description: GET /api/pagos/{boleta_id}/ — Admin/Vendedor o cliente dueño.
      parameters:
      - in: path
        name: boleta_id
        schema:
          type: integer
        required: true
      tags:
      - pagos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/pagos/efectivo/:
    post:
      operationId: pagos_efectivo_create
      description: |-
        POST /api/pagos/efectivo/
        El vuelto lo calcula el model.save() automáticamente.
      tags:
      - pagos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/pagos/mp-tarjeta/:
    post:
      operationId: pagos_mp_tarjeta_create
      description: POST /api/pagos/mp-tarjeta/ — el frontend envía el card token ya
        generado.
      tags:
      - pagos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/pagos/mp-yape/:
    post:
      operationId: pagos_mp_yape_create
      description: POST /api/pagos/mp-yape/ — celular + OTP del cliente.
      tags:
      - pagos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/pagos/webhook/:
    post:
      operationId: pagos_webhook_create
      description: |-
        POST /api/pagos/webhook/
        Recibe notificaciones push de MP. Valida firma HMAC-SHA256.

        MP envía:
          Header x-signature:  ts=<timestamp>;v1=<hash>
          Header x-request-id: <uuid>
          Body: {"type": "payment", "data": {"id": "123456789"}, ...}
      tags:
      - pagos
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/productos/:
    get:
      operationId: productos_list
      description: |-
        GET: lista con filtros (todos los roles).
        POST: crear producto (Admin).
      parameters:
      - in: query
        name: activo
        schema:
          type: boolean
      - in: query
        name: categoria
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - in: query
        name: padre
        schema:
          type: string
        description: 'Convencion: <CATEGORIA>-<correlativo> (ej: BEB-001, CON-001).
          Debe coincidir EXACTAMENTE con el prefijo del id_chroma en ChromaDB (el
          ia-service hace split("_")[0] para extraerlo).'
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - productos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoListList'
          description: ''
    post:
      operationId: productos_create
      description: |-
        GET: lista con filtros (todos los roles).
        POST: crear producto (Admin).
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoWrite'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoWrite'
          description: ''
  /api/productos/{sku}/:
    get:
      operationId: productos_retrieve
      description: 'GET: todos; PATCH: Admin; DELETE: soft delete (Admin).'
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - productos
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDetail'
          description: ''
    put:
      operationId: productos_update
      description: 'GET: todos; PATCH: Admin; DELETE: soft delete (Admin).'
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoWrite'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoWrite'
          description: ''
    patch:
      operationId: productos_partial_update
      description: 'GET: todos; PATCH: Admin; DELETE: soft delete (Admin).'
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - productos
      requestBody:
